name: Deploy to Cloudflare Pages

# Každý push do main nasadí web na Cloudflare Pages (projekt vykopy-sazava).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build publish dir
        run: |
          mkdir -p out
          cp index.html out/
          cp robots.txt sitemap.xml favicon.svg out/
          cp -r assets out/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=vykopy-sazava --branch=main
